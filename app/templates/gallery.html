<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astro Pi Camera — Gallery</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Gallery</h1>
    <nav>
      <a href="{{ url_for('index') }}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
        Back
      </a>
    </nav>
  </header>

  {% if not sessions %}
    <p class="hint" style="margin: 1rem;">No captures yet.</p>
  {% else %}
    <form action="{{ url_for('delete_all') }}" method="post"
          onsubmit="return confirm('Delete ALL sessions and images? This cannot be undone.');">
      <button type="submit" class="danger" style="margin: 0 1rem 1rem; width: calc(100% - 2rem);">Delete all captures</button>
    </form>
  {% endif %}

  {% for session in sessions %}
    <section class="card">
      <div class="session-header">
        <h2>{{ session.name }}</h2>
        <div class="session-actions">
          <a class="button-link small" href="{{ url_for('download_session_zip', session_name=session.name) }}">Download (.zip)</a>
          <form action="{{ url_for('delete_session', session_name=session.name) }}" method="post"
                onsubmit="return confirm('Delete this whole session ({{ session.files|length }} image(s))?');">
            <button type="submit" class="danger small">Delete session</button>
          </form>
        </div>
      </div>
      <div class="thumbs">
        {% for f in session.files %}
          <div class="thumb-wrap">
            <a href="{{ url_for('download_capture', session_name=session.name, filename=f.name) }}">
              <img class="thumb" src="{{ url_for('download_capture', session_name=session.name, filename=f.name) }}" alt="{{ f.name }}">
            </a>
            {% if f.has_raw %}
              <span class="thumb-raw-badge" title="Raw DNG also saved">RAW</span>
            {% endif %}
            <form action="{{ url_for('delete_capture', session_name=session.name, filename=f.name) }}" method="post"
                  onsubmit="return confirm('Delete {{ f.name }}?');">
              <button type="submit" class="danger thumb-delete" aria-label="Delete {{ f.name }}">&times;</button>
            </form>
          </div>
        {% endfor %}
      </div>
    </section>
  {% endfor %}
</body>
</html>
